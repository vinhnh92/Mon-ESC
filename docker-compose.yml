services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-wordpress}
      MARIADB_USER: ${DB_USER:-wordpress}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Thiếu DB_PASSWORD trong .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Thiếu DB_ROOT_PASSWORD trong .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${SITE_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_MEMORY_LIMIT', '256M');
        define('DISALLOW_FILE_EDIT', true);
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/mon-esc:/var/www/html/wp-content/themes/mon-esc
      - ./wp-content/plugins/mon-esc-shop:/var/www/html/wp-content/plugins/mon-esc-shop
      - ./config/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro

  # Công cụ dòng lệnh: docker compose run --rm wpcli <lệnh>
  wpcli:
    image: wordpress:cli-php8.3
    profiles: ["tools"]
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      HOME: /tmp
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/mon-esc:/var/www/html/wp-content/themes/mon-esc
      - ./wp-content/plugins/mon-esc-shop:/var/www/html/wp-content/plugins/mon-esc-shop
      - ./scripts:/scripts:ro

volumes:
  db_data:
  wp_data:
